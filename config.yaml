# Haber kaynakları. Sıra önceliktir: aynı haber iki kaynakta varsa üstteki kullanılır.
feeds:
  - name: MMA Fighting
    url: https://www.mmafighting.com/rss/index.xml
  - name: Sherdog
    url: https://www.sherdog.com/rss/news.xml

daily_limit: 20
max_per_run: 1
max_age_hours: 12
similarity_threshold: 0.7
similarity_window_hours: 48

exclude_keywords:
  - betting
  - odds and
  - best bets
  - predictions
  - staff picks
  - fantasy
  - how to watch
  - live stream

image_mode: feed # feed | none
image_min_width: 600
image_blocklist: [] # görseli kullanılmayacak kaynak adları, örn. [Sherdog]

llm:
  max_chars: 270 # "Kaynak: ..." dahil toplam üst sınır
  providers: # sırayla denenir; hata veya limit olursa sonrakine geçilir
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      key_env: GROQ_API_KEY
