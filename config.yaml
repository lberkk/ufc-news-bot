# Haber kaynakları. Her koşuda hepsi birlikte taranır ve haberler yayın saatine göre işlenir;
# aynı haber iki kaynakta varsa önce yayımlanan paylaşılır, diğeri tekrar olarak elenir.
feeds:
  - name: MMA Fighting
    url: https://www.mmafighting.com/rss/index.xml
  - name: Bloody Elbow
    url: https://bloodyelbow.com/feed/
  - name: Sherdog
    url: https://www.sherdog.com/rss/news.xml

daily_limit: 10
max_per_run: 1
max_age_hours: 3
similarity_threshold: 0.7
similarity_window_hours: 48

exclude_keywords:
  - betting
  - odds and
  - best bets
  - predictions
  - staff picks
  - fantasy
  - how to watch
  - live stream
  - live blog

image_mode: feed # feed | none
image_min_width: 600
image_blocklist: [] # görseli kullanılmayacak kaynak adları, örn. [Sherdog]

llm:
  max_chars: 200 # "Kaynak: ..." dahil toplam üst sınır
  glossary: # İngilizce: Türkçe
    flyweight: sinek siklet
    bantamweight: horoz siklet
    featherweight: tüy siklet
    lightweight: hafif siklet
    welterweight: yarı orta siklet
    middleweight: orta siklet
    light heavyweight: hafif ağır siklet
    heavyweight: ağır siklet
    knockout: nakavt
    technical knockout: teknik nakavt
    decision: hakem kararı
    unanimous decision: ortak karar
    split decision: ayrık karar
    majority decision: çoğunluk kararı
    majority draw: çoğunluk kararıyla beraberlik
    split draw: ayrık kararla beraberlik
    submission: pes ettirme
    submitted (someone): pes ettirdi
    finish: bitiriş
    title fight: kemer maçı
    title defense: kemer savunması
    interim title: geçici kemer
    undisputed champion: tartışmasız şampiyon
    main card: ana kart
    main event: ana maç
    co-main event: eş ana maç
    prelims: ön kart
    weigh-in: tartı
    missed weight: tartıyı tutturamadı
    faceoff or staredown: bakışma
    record (10-0): derece
    debut: ilk maç
    tech fall (wrestling): teknik üstünlük
    pin (wrestling): tuş
  keep_english: # çevrilmeyecek, kaynaktaki haliyle yazılacak
    - rear-naked choke
    - D'Arce choke
    - guillotine
    - armbar
    - kimura
    - wheel kick
    - takedown
    - ground and pound
    - clinch
    - catchweight
    - no contest
  providers: # sırayla denenir; hata veya limit olursa sonrakine geçilir
    - name: claude-haiku
      type: anthropic # Anthropic SDK ile çağrılır; diğerleri OpenAI uyumlu
      model: claude-haiku-5-5
      key_env: ANTHROPIC_API_KEY
    - name: groq
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      key_env: GROQ_API_KEY
